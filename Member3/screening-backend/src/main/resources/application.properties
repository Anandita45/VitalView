# Application Configuration
spring.application.name=screening-backend
server.port=${PORT:8081}

# Management and Observability
management.endpoints.web.exposure.include=health,info

# Python AI Worker Configuration
app.ai.base-url=${AI_BASE_URL:http://localhost:8000}
app.ai.api-key=${AI_API_KEY:}
app.ai.timeout-ms=${AI_TIMEOUT_MS:5000}

# Database Configuration
# In-memory H2 database by default for local development/testing without external services
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:screeningdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

